[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# WordPress Playground (playground.wordpress.net) fetches the live-preview
# blueprint and site package from the browser, so they need CORS.
[[headers]]
  for = "/playground/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"

# WordPress sites check the plugin release manifest for updates; keep it fresh.
[[headers]]
  for = "/downloads/*.json"
  [headers.values]
    Cache-Control = "public, max-age=300"

# FutureLabs AI SEO Pro talks to futurelabs.africa, not to Supabase directly, so
# installed sites keep working if the backend moves. Both are proxied (200).
# Licence API (supabase/functions/license):
[[redirects]]
  from = "/api/license"
  to = "https://xgemmlbsmmqwysatmbvz.supabase.co/functions/v1/license"
  status = 200
  force = true

# Short-lived signed links to Pro zips in the private `pro-downloads` bucket.
[[redirects]]
  from = "/api/storage/object/sign/pro-downloads/*"
  to = "https://xgemmlbsmmqwysatmbvz.supabase.co/storage/v1/object/sign/pro-downloads/:splat"
  status = 200
  force = true

# Research briefing sign-up and unsubscribe (supabase/functions/briefing-*).
[[redirects]]
  from = "/api/briefing-signup"
  to = "https://xgemmlbsmmqwysatmbvz.supabase.co/functions/v1/briefing-signup"
  status = 200
  force = true

[[redirects]]
  from = "/api/briefing-unsubscribe"
  to = "https://xgemmlbsmmqwysatmbvz.supabase.co/functions/v1/briefing-unsubscribe"
  status = 200
  force = true

# Instant Lead Responder: embed form posts and tracked booking links (supabase/functions/lead-*).
[[redirects]]
  from = "/api/lead-intake"
  to = "https://xgemmlbsmmqwysatmbvz.supabase.co/functions/v1/lead-intake"
  status = 200
  force = true

[[redirects]]
  from = "/api/lead-book/*"
  to = "https://xgemmlbsmmqwysatmbvz.supabase.co/functions/v1/lead-book/:splat"
  status = 200
  force = true

# 48-hour signed links to briefing PDFs in the private `briefings` bucket.
[[redirects]]
  from = "/api/storage/object/sign/briefings/*"
  to = "https://xgemmlbsmmqwysatmbvz.supabase.co/storage/v1/object/sign/briefings/:splat"
  status = 200
  force = true

# Gated files must not be indexed, or search engines would bypass the form.
[[headers]]
  for = "/api/storage/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/downloads/*.pdf"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
